# nginx 파일입니다. docker-compose와 함께 최상위 폴더에 위치하고 있습니다.(최상위/docker-compose.yml)

server {
    # 80번 포트로 들어오는 HTTP 요청을 수신
    listen 80;
    server_name _; # localhost 대신 _ 로 두면 어떤 IP로 들어오는 요청이든 모두 수신합니다.

    # Nginx 전체 요청 바디 용량 제한을 10MB로 변경 (필요에 따라 20M, 50M 조정 가능)
    client_max_body_size 20M;

    # Gzip 압축 활성화 (네트워크 전송량 감소 및 React 로딩 속도 향상)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. 프론트엔드 정적 파일 서빙 (React SPA 경로 설정)
    location / {
        root /usr/share/nginx/html; # React 빌드 결과물이 위치한 경로
        index index.html index.htm;
        
        # React Single Page Application(SPA) 라우팅 처리
        # 요청한 파일이 없으면 index.html로 리다이렉트하여 React Router가 처리하도록 함
        try_files $uri $uri/ /index.html;
    }

    # 2. 백엔드 API 요청 리버스 프록시 설정
    # 프론트엔드에서 /api 로 시작하는 요청을 보낼 때 백엔드 컨테이너로 전달
    # admin, api, cart, chatbot.message, payment, subscribe 로 시작하는 요청 매칭
    # location ~ ^/(admin|api|cart|chatbot\.message|payment|subscribe)(/|$) {
    location /back/ {
        # docker-compose.yml에 정의된 백엔드 서비스 이름(backend)과 포트(8080) 사용
        proxy_pass http://backend:8088/;

        # 웹소켓(WebSocket/SockJS) 프로토콜 업그레이드 필수 설정(양방향이니 연결끊지 마라~)
        # Handshake - 웹소켓 프로토콜로 스위칭(업그레이드)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 클라이언트의 실제 IP 및 헤더 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 웹소켓 연결 유지 타임아웃 (기본 60초에서 연장 -> 1시간)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}