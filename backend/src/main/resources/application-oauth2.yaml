spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_ID}
            client-secret: ${OAUTH_GOOGLE_KEY}
            # redirect-uri: "${FRONT_URL}.sslip.io/back/login/oauth2/code/google"
            redirect-uri: "http://54.116.208.12.sslip.io/back/login/oauth2/code/google"
            scope:
              - email
              - profile

          naver:
            client-id: ${OAUTH_NAVER_ID}
            client-secret: ${OAUTH_NAVER_KEY}
            redirect-uri: ${OAUTH_NAVER_URI}
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
            client-name: naver

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response